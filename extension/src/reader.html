<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Post reader</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f1e8;
        --panel: #fffaf0;
        --border: #d6ccb8;
        --text: #1c1917;
        --accent: #0f766e;
        --muted: #57534e;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1917;
          --panel: #292524;
          --border: #44403c;
          --text: #f5f5f4;
          --accent: #2dd4bf;
          --muted: #a8a29e;
        }
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      main {
        max-width: 38rem;
        margin: 2.5rem auto;
        padding: 0 1rem;
      }

      .tweet {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 1.25rem;
      }

      .tweet.quote {
        margin-top: 1rem;
        padding: 0.9rem;
        border-radius: 14px;
        background: transparent;
      }

      .author {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .avatar {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--border);
        flex: none;
      }

      .quote .avatar {
        width: 28px;
        height: 28px;
      }

      .name {
        font-weight: 700;
      }

      .handle,
      footer,
      .status,
      .attempts {
        color: var(--muted);
      }

      .text {
        margin-top: 0.9rem;
        font-size: 1.12rem;
        line-height: 1.5;
        white-space: normal;
        overflow-wrap: anywhere;
      }

      .quote .text {
        font-size: 1rem;
      }

      a {
        color: var(--accent);
      }

      .media {
        display: grid;
        gap: 4px;
        margin-top: 0.9rem;
        border-radius: 14px;
        overflow: hidden;
      }

      .media-2,
      .media-3,
      .media-4 {
        grid-template-columns: 1fr 1fr;
      }

      .media-item img,
      .media-item video {
        display: block;
        width: 100%;
        height: 100%;
        max-height: 34rem;
        object-fit: cover;
        background: #000;
      }

      .media-1 .media-item img,
      .media-1 .media-item video {
        object-fit: contain;
      }

      footer {
        margin-top: 1rem;
        padding-top: 0.75rem;
        border-top: 1px solid var(--border);
        font-size: 0.92rem;
      }

      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        margin-top: 0.5rem;
      }

      .stats strong {
        color: var(--text);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
        margin-top: 1rem;
        font-size: 0.92rem;
      }

      button {
        padding: 0.55rem 0.9rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--panel);
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }

      button:hover {
        border-color: var(--accent);
      }

      .attempts {
        margin: 0.75rem 0 0;
        padding-left: 1.2rem;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="content" aria-live="polite">
        <p class="status">Loading post…</p>
      </div>
      <div class="actions">
        <button id="open-on-x" type="button">Open on X</button>
        <a id="open-embed" href="#" rel="noreferrer noopener">X embed</a>
        <span id="source-note" class="status"></span>
      </div>
    </main>
    <script type="module" src="./reader.js"></script>
  </body>
</html>
